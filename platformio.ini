[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    olikraus/U8g2@^2.35.30
    earlephilhower/ESP8266Audio@^2.4.1
build_flags =
    -DWIRE_INTERFACES_COUNT=2
build_src_filter = +<*> -<audio_test.cpp> -<sensor_c3.cpp>

[env:audio_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    earlephilhower/ESP8266Audio@^2.4.1
build_src_filter = -<*> +<audio_test.cpp>

[env:sensor_c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
lib_deps =
    dfrobot/DFRobot_BloodOxygen_S@^1.0.0
    dfrobot/DFRobot_RTU@^1.0.6
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
build_src_filter = -<*> +<sensor_c3.cpp>
