; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    dfrobot/DFRobot_BloodOxygen_S@^1.0.0
    dfrobot/DFRobot_RTU@^1.0.6
    olikraus/U8g2@^2.35.30
    earlephilhower/ESP8266Audio@^2.4.1
; ESP32 co 2 bus I2C nhung khong khai bao macro nay -> U8g2 se bo qua Wire1
build_flags =
    -DWIRE_INTERFACES_COUNT=2
build_src_filter = +<*> -<audio_test.cpp>

; Chuong trinh test loa MAX98357A + the nho (src/audio_test.cpp)
; Chay: pio run -e audio_test -t upload -t monitor
[env:audio_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    earlephilhower/ESP8266Audio@^2.4.1
build_src_filter = -<*> +<audio_test.cpp>
