[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    dfrobot/DFRobot_BloodOxygen_S@^1.0.0
    dfrobot/DFRobot_RTU@^1.0.6
    olikraus/U8g2@^2.35.30
    earlephilhower/ESP8266Audio@^2.4.1
build_flags =
    -DWIRE_INTERFACES_COUNT=2
build_src_filter = +<*> -<audio_test.cpp>

[env:audio_test]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    earlephilhower/ESP8266Audio@^2.4.1
build_src_filter = -<*> +<audio_test.cpp>
